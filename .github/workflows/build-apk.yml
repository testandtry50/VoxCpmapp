name: Build APK from ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Force compileSdk 36 for all plugins (fixes checkReleaseAarMetadata)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-compile-sdk.gradle <<'EOF2'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android')) {
                p.android.compileSdk = 36
              }
            }
          }
          EOF2

      - name: Generate Android project and add our code
        run: |
          # If the project is only present as a .zip, extract it first
          find_app() { find . -type d -path '*/app/lib' -not -path './out/*' -not -path './_src/node_modules/*' | head -1; }
          if [ -z "$(find_app)" ]; then
            ZIP=$(find . -maxdepth 2 -name '*.zip' | head -1)
            echo "Extracting $ZIP"
            unzip -q -o "$ZIP" -d _src
          fi
          APP=$(dirname "$(find_app)")
          echo "Using app dir: $APP"
          flutter create --platforms=android --org com.voxcpm --project-name voxcpm_mobile out
          rm -rf out/lib out/test
          cp -r "$APP/lib" out/lib
          cp "$APP/pubspec.yaml" out/pubspec.yaml
          M=out/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' $M
          sed -i 's|android:label="voxcpm_mobile"|android:label="VoxCPM"|' $M

      - name: Build release APK
        working-directory: out
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: voxcpm-apk
          path: out/build/app/outputs/flutter-apk/app-release.apk
